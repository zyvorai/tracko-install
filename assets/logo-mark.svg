<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Tracko">
  <defs>
    <linearGradient id="tg" x1="6" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B9BFF"/>
      <stop offset="0.55" stop-color="#0071E3"/>
      <stop offset="1" stop-color="#0040C8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tg)"/>
  <!-- soft inner highlight -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
  <!-- route path — full opacity white for max visibility -->
  <path d="M13 44 C 21 26, 27 50, 36 28 C 42 14, 47 36, 53 22"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- origin -->
  <circle cx="13" cy="44" r="6" fill="#FFFFFF"/>
  <circle cx="13" cy="44" r="2.6" fill="#0071E3"/>
  <!-- destination — high-contrast cyan disc -->
  <circle cx="53" cy="22" r="6.5" fill="#FFFFFF"/>
  <circle cx="53" cy="22" r="4" fill="#7DDCFF"/>
  <circle cx="53" cy="22" r="1.8" fill="#003DAA"/>
</svg>
