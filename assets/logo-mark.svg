<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Tracko">
  <defs>
    <linearGradient id="tg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A84FF"/>
      <stop offset="1" stop-color="#0055D4"/>
    </linearGradient>
    <linearGradient id="path" x1="12" y1="44" x2="52" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C8EBFF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tg)"/>
  <!-- route -->
  <path d="M14 42 C 22 28, 28 48, 36 30 C 42 18, 46 34, 52 24"
        stroke="url(#path)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- origin -->
  <circle cx="14" cy="42" r="5" fill="#FFFFFF"/>
  <circle cx="14" cy="42" r="2.2" fill="#0A84FF"/>
  <!-- destination -->
  <circle cx="52" cy="24" r="5.5" fill="#B8E4FF"/>
  <circle cx="52" cy="24" r="2.4" fill="#0055D4"/>
</svg>
